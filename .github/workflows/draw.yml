name: Tirage Secret Santa
run-name: Tirage Secret Santa par @${{ github.actor }}
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: secret-santa-draw
  cancel-in-progress: false
jobs:
  draw:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run draw
      - name: Enregistrer le résultat
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/election.json public/data/config.json
          git commit -m 'Enregistrer le tirage Secret Santa'
          git push origin HEAD:main
